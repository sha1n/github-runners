name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check scripts
        run: |
          for f in *.sh lib/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: Run process-helper tests
        run: ./tests/test_process_helpers.sh
